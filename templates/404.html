{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}
{% block page_title %}Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="p-5 bg-white border rounded-4 shadow-sm">
            <div class="display-1 fw-bold text-primary mb-2">404</div>
            <h4 class="fw-semibold text-dark mb-3">Page Not Found</h4>
            <p class="text-secondary mb-4">The resource or URL you requested does not exist or may have been relocated.</p>
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary-custom px-4">
                <i class="bi bi-house-door me-1"></i> Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
